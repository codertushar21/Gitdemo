<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salary Tax Calculator</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 2rem; }
      .container { max-width: 420px; margin: 0 auto; }
      label, input { display: block; width: 100%; }
      input[type="text"]{ padding: 8px; margin: 8px 0 12px; }
      button{ padding: 8px 12px; }
      .flash { color: #a00; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Salary Tax Calculator</h1>
      {% with messages = get_flashed_messages(category_filter=["error"]) %}
        {% if messages %}
          <div class="flash">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="post" action="/calculate">
        <label for="salary">Enter your salary</label>
        <input id="salary" name="salary" type="text" placeholder="e.g. 45000" required>
        <button type="submit">Calculate</button>
      </form>
      <p style="margin-top:1rem"><small>Or use the CLI: see USAGE.md</small></p>
    </div>
  </body>
</html>
